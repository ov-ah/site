<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">

	<title>ovah.dev · chat</title>
	<link rel="stylesheet" href="../styles.css">
</head>

<body>
	<div class="container">
		<nav>
			<div id="logo"></div>
			<div id="nav-items">
				<a href="/">home</a>
				·
				<a href="/about">about</a>
				·
				<a href="/chat">chat</a>
			</div>
		</nav>
		<section>
			<p>
				ovah.dev has the best chat trust! say something.
			</p>
		</section>
		<section class="chat">
			<div class="chat-status" id="chat-status">connecting...</div>
			<div class="chat-messages" id="chat-messages">
				<p class="chat-empty">loading history...</p>
			</div>
			<form class="chat-form" id="chat-form" autocomplete="off">
				<input type="text" id="chat-text" class="chat-input" maxlength="500" placeholder="say something..."
					required>
				<button type="submit" id="chat-send" disabled>send</button>
			</form>
		</section>
		<footer>
			<p>
				<a href="/">home</a>
				·
				<a href="/about">about</a>

			<p>
				©
				<a href="/">ovah</a>
			</p>
			<p>
				🐇
			</p>
		</footer>
	</div>
	<script src="chat.js"></script>
</body>

</html>
