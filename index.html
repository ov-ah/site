<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chat</title>
  <style>
    body { font-family: system-ui; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 0.5rem; margin: 0.5rem 0; }
    .msg { margin: 0.25rem 0; }
    .user { font-weight: bold; }
    .ts { color: #888; font-size: 0.8em; margin-left: 0.5rem; }
    form { display: flex; gap: 0.5rem; }
    input[type=text] { flex: 1; padding: 0.5rem; }
    button { padding: 0.5rem 1rem; }
    #status { font-size: 0.8em; color: #888; }
  </style>
</head>
<body>
  <h1>Chat</h1>
  <div>
    <input id="username" placeholder="Your name" value="anon">
    <span id="status">connecting...</span>
  </div>
  <div id="messages"></div>
  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off">
    <button>Send</button>
  </form>
<script>
  const messages = document.getElementById('messages');
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const username = document.getElementById('username');
  const status = document.getElementById('status');

  function render(msg) {
    const div = document.createElement('div');
    div.className = 'msg';
    const time = new Date(msg.ts).toLocaleTimeString();
    const userSpan = document.createElement('span');
    userSpan.className = 'user';
    userSpan.textContent = msg.user;
    const textSpan = document.createElement('span');
    textSpan.textContent = ': ' + msg.text;
    const tsSpan = document.createElement('span');
    tsSpan.className = 'ts';
    tsSpan.textContent = time;
    div.append(userSpan, textSpan, tsSpan);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  fetch('/history')
    .then(r => r.json())
    .then(msgs => msgs.forEach(render))
    .catch(e => console.error('history load failed:', e));

  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { status.textContent = 'connected'; };
  ws.onclose = () => { status.textContent = 'disconnected'; };
  ws.onerror = () => { status.textContent = 'error'; };
  ws.onmessage = (e) => render(JSON.parse(e.data));

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!input.value.trim()) return;
    ws.send(JSON.stringify({ user: username.value || 'anon', text: input.value }));
    input.value = '';
  });
</script>
</body>
</html>
